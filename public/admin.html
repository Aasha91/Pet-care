<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
        }

        header {
            background: #5b3cc4;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        #logoutButton {
            background: white;
            color: #5b3cc4;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .admin-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .admin-card h2 {
            color: #5b3cc4;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .module-card {
            padding: 20px;
            background: #f8f7ff;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .module-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>Veterinary Admin Dashboard</h1>

        <button id="logoutButton">
            Logout
        </button>

    </header>


    <main>

        <div class="admin-card">

            <h2>Welcome, <span id="adminUsername"></span> 👋</h2>

            <p>
                You are logged in as an administrator.
            </p>


            <div class="module-grid">

                <div class="module-card">
                    <h3>👤 Owners</h3>
                    <p>Manage pet owners.</p>
                </div>

                <div class="module-card">
                    <h3>🐾 Pets</h3>
                    <p>Manage registered pets.</p>
                </div>

                <div class="module-card">
                    <h3>💊 Treatments</h3>
                    <p>Manage medical treatments.</p>
                </div>

                <div class="module-card">
                    <h3>📅 Appointments</h3>
                    <p>Manage veterinary appointments.</p>
                </div>

            </div>

        </div>

    </main>


    <script>

        // Check login status
        const loggedInUser =
            sessionStorage.getItem("loggedInUser");

        if (!loggedInUser) {

            window.location.href = "/login.html";

        } else {

            document.getElementById("adminUsername").textContent =
                loggedInUser;

        }


        // Logout
        document.getElementById("logoutButton").addEventListener(
            "click",
            async function () {

                try {

                    await fetch("/api/users/logout", {
                        method: "POST"
                    });

                } catch (error) {

                    console.error("Logout error:", error);

                }

                sessionStorage.removeItem("loggedInUser");

                window.location.href = "/login.html";

            }
        );

    </script>

</body>

</html>
